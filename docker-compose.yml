services:
  # O Banco de Dados PostgreSQL
  db:
    image: postgres:16-alpine
    container_name: csm_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: csm_db
    ports:
      - "5433:5432" # Mapeia a porta interna 5432 para 5433 na rede local
    volumes:
      - csm_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d csm_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # O Cache e Mensageria Redis
  redis:
    image: redis:7-alpine
    container_name: csm_redis
    ports:
      - "6379:6379" # Exposta na rede local para a sua máquina principal
    volumes:
      - csm_redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # O Broker Kafka em modo KRaft (Sem Zookeeper)
  kafka:
    image: apache/kafka:latest
    container_name: csm_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://192.168.0.103:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8090:8080"
    restart: always
    environment:
      - KAFKA_CLUSTERS_0_NAME=Cluster-Local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=192.168.0.103:9092
      # Se você usar schema registry ou kafka connect no futuro, pode adicionar as URLs aqui:
      # - KAFKA_CLUSTERS_0_SCHEMAREGISTRY=http://192.168.0.103:8081

volumes:
  csm_data:
  csm_redis_data:
  kafka_data: